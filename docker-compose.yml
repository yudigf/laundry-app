services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laundry_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - laundry_network

  web:
    image: nginx:alpine
    container_name: laundry_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laundry_network

networks:
  laundry_network:
    driver: bridge
